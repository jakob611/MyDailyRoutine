name: Android verification
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "Publish a commit-specific test release after build AND device tests pass"
        type: boolean
        default: false
      # M9/N16: the first run that seeds the baseline is the manual one, because a baseline captured
      # by the same run it is compared against would prove nothing.
      seed_baseline:
        description: "Seed the UI screenshot baseline from this run (N16)"
        type: boolean
        default: false
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # android-actions/setup-android@v3 started failing in ~15s on both jobs before any
      # Gradle step (runs 35060558857 / 35060749097). Use the SDK the runner already ships,
      # discover it instead of hardcoding a path, and publish findings as annotations so a
      # failure is readable without the (blob-hosted) step log.
      - name: Locate the Android SDK
        run: |
          sdk=""
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then sdk="$candidate"; break; fi
          done
          sm="$(command -v sdkmanager || true)"
          if [ -z "$sm" ] && [ -n "$sdk" ]; then
            sm="$(find "$sdk" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            sm="$(find /usr /opt "$HOME" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            echo "::error::No sdkmanager on this runner. ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT sdk=$sdk"
            find / -maxdepth 4 -type d -name 'android*' 2>/dev/null | head -20 | sed 's|^|::notice::dir |'
            exit 1
          fi
          sdk="${sdk:-$(dirname "$(dirname "$(dirname "$sm")")")}"
          echo "::notice::Using ANDROID_HOME=$sdk with sdkmanager=$sm"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$(dirname "$sm")" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          "$sm" --version || { echo "::error::sdkmanager present but not runnable: $sm"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: "Static gates: schema, presentation invariants, WCAG contrast"
        run: python3 tools/derive_palette.py --check && python3 tools/check_sqlite_integrity.py && python3 tools/check_translations.py && python3 tools/check_presentation.py && python3 tools/check_contrast.py
      - name: Build, unit tests and lint
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace 2>&1 | tee ci-build.log
      - name: Publish compiler and test diagnostics
        if: always()
        run: python3 tools/report_ci_failures.py
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = failed = 0
          for path in sorted(glob.glob('core/build/test-results/*/TEST-*.xml') + glob.glob('app/build/test-results/*/TEST-*.xml')):
              root = ET.parse(path).getroot()
              tests = int(root.get('tests', 0)); bad = int(root.get('failures', 0)) + int(root.get('errors', 0))
              total += tests; failed += bad
              print(f"{root.get('name')}: {tests} tests, {bad} failed")
          print(f"UNIT TESTS TOTAL: {total} tests, {failed} failed")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Unit tests\n\n")
              for path in sorted(glob.glob('core/build/test-results/*/TEST-*.xml') + glob.glob('app/build/test-results/*/TEST-*.xml')):
                  root = ET.parse(path).getroot()
                  bad = int(root.get('failures', 0)) + int(root.get('errors', 0))
                  mark = "pass" if bad == 0 else "FAIL"
                  out.write(f"- `{root.get('name')}`: {root.get('tests')} tests, {bad} failed ({mark})\n")
              out.write(f"\n**Total: {total} tests, {failed} failed**\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/
            app/build/reports/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the SDK; setup-android@v3 started failing on the
      # action side (both jobs, ~15s, before any Gradle step), so pin to the local SDK.
      - name: Locate the Android SDK
        run: |
          sdk=""
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then sdk="$candidate"; break; fi
          done
          sm="$(command -v sdkmanager || true)"
          if [ -z "$sm" ] && [ -n "$sdk" ]; then
            sm="$(find "$sdk" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            sm="$(find /usr /opt "$HOME" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            echo "::error::No sdkmanager on this runner. ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT sdk=$sdk"
            exit 1
          fi
          sdk="${sdk:-$(dirname "$(dirname "$(dirname "$sm")")")}"
          echo "::notice::Using ANDROID_HOME=$sdk with sdkmanager=$sm"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$(dirname "$sm")" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          "$sm" --version || { echo "::error::sdkmanager present but not runnable: $sm"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/ci-device-tests.sh
      - name: Publish device diagnostics
        if: always()
        run: python3 tools/report_ci_failures.py
      # N16: the screenshots this run captured are compared with the seeded baseline, screen by screen.
      # Advisory on purpose: a changed picture is a question ("did we mean to change that?"), and the
      # answer belongs to the reader of the run, not to a failing step.
      - name: Compare screenshots with the seeded baseline
        if: always() && github.event.inputs.seed_baseline != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          baseline=baseline-shots
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ui-baseline&per_page=1" --jq '.artifacts[0].id // empty' 2>/dev/null || true)
          if [ -n "$id" ]; then
            echo "::notice::comparing against ui-baseline artifact $id"
            mkdir -p "$baseline"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/ui-baseline.zip \
              && unzip -q -o /tmp/ui-baseline.zip -d "$baseline" \
              || { echo "::warning title=Screenshot regression::baseline artifact could not be unpacked"; rm -rf "$baseline"; }
          fi
          python3 tools/compare_shots.py --baseline "$baseline" --current app/build/ui-audit
      # Seeding is a manual, deliberate run: the pictures it captured become the reference.
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.seed_baseline == 'true'
        with:
          name: ui-baseline
          path: app/build/ui-audit/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ci-device.log
            ci-device-crash.log
            ci-device-logcat.log
            app/build/ui-audit/

  publish:
    # Never replace a downloadable "green" APK while the emulator job is still running.
    needs: [build, device-tests]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apks
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apks
      - name: Publish verified test APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="test-${GITHUB_SHA:0:12}"
          title="Test APK — ${GITHUB_SHA:0:12}"
          flags=(--prerelease --latest=false)
          if [ "$EVENT_NAME" = "push" ]; then
            tag="debug-latest"
            title="APK (zadnji zeleni CI): release + debug"
            flags=()
          fi
          cat > notes.md <<EOF
          Preverjena gradnja: $GITHUB_SHA
          CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Prenesi **app-release.apk** za testiranje zmogljivosti (release varianta, R8 in resource shrinking).
          app-debug.apk je namenjen diagnostiki.

          Build, JVM testi, lint in testi na emulatorju so uspeli pred objavo.
          APK je podpisan s testnim/debug kljucem; to ni produkcijska/store izdaja.
          Ce Android zavrne posodobitev zaradi drugega podpisa, pred odstranitvijo stare aplikacije izvozi podatke.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${flags[@]}"
          fi
          gh release upload "$tag" apks/app-release.apk apks/app-debug.apk --clobber
          echo "## Test APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download release APK](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/app-release.apk)" >> "$GITHUB_STEP_SUMMARY"
