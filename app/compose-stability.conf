// Stability the compiler cannot see for itself.
//
// The Compose compiler only judges the stability of a type it compiles, so every value that crosses
// from :core into :app arrives as "unstable" no matter how immutable it is — and an unstable
// parameter makes the composable that takes it unskippable, which means it recomposes whenever its
// caller does, even when nothing it reads has changed. The timeline, the sheets and the overview
// screens all take these types directly, so they are declared here.
//
// The rule for adding a line: the class is a `val`-only data class from :core that a composable
// takes as a parameter, or that a UI state object holds. Never a repository, an engine, a planner or
// a database snapshot — those hold mutable state, and a class listed here is trusted absolutely:
// Compose will skip recompositions on the strength of this file, so a lie in it is a stale screen.
//
// java.time values are immutable; never mark mutable database snapshots stable.
java.time.**

