name: Android verification
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # android-actions/setup-android@v3 started failing in ~15s on both jobs before any
      # Gradle step (runs 35060558857 / 35060749097). Use the SDK the runner already ships,
      # discover it instead of hardcoding a path, and publish findings as annotations so a
      # failure is readable without the (blob-hosted) step log.
      - name: Locate the Android SDK
        run: |
          sdk=""
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then sdk="$candidate"; break; fi
          done
          sm="$(command -v sdkmanager || true)"
          if [ -z "$sm" ] && [ -n "$sdk" ]; then
            sm="$(find "$sdk" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            sm="$(find /usr /opt "$HOME" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            echo "::error::No sdkmanager on this runner. ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT sdk=$sdk"
            find / -maxdepth 4 -type d -name 'android*' 2>/dev/null | head -20 | sed 's|^|::notice::dir |'
            exit 1
          fi
          sdk="${sdk:-$(dirname "$(dirname "$(dirname "$sm")")")}"
          echo "::notice::Using ANDROID_HOME=$sdk with sdkmanager=$sm"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$(dirname "$sm")" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          "$sm" --version || { echo "::error::sdkmanager present but not runnable: $sm"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: "Static gates: schema, presentation invariants, WCAG contrast"
        run: python3 tools/derive_palette.py --check && python3 tools/check_sqlite_integrity.py && python3 tools/check_presentation.py && python3 tools/check_contrast.py
      - name: Build, unit tests and lint
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace 2>&1 | tee ci-build.log
      - name: Publish compiler and test diagnostics
        if: always()
        run: python3 tools/report_ci_failures.py
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for path in sorted(glob.glob('core/build/test-results/*/TEST-*.xml') + glob.glob('app/build/test-results/*/TEST-*.xml')):
              root = ET.parse(path).getroot()
              tests = int(root.get('tests', 0)); bad = int(root.get('failures', 0)) + int(root.get('errors', 0))
              total += tests; failed += bad
              print(f"{root.get('name')}: {tests} tests, {bad} failed")
          print(f"UNIT TESTS TOTAL: {total} tests, {failed} failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/
            app/build/reports/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish debug APK to rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          rel=$(ls app/build/outputs/apk/release/*unsigned*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          notes="app-release.apk je MINIFICIRANA (R8) gradnja za vsakdanje testiranje na telefonu - obcutno tekoca od debug razlicice, ki nosi Compose debug instrumentacijo. app-debug.apk ostaja za loge. Gradnja ${{ github.sha }} iz CI (build + emulator testi), podpisano z debug kljucem: pred namestitvijo dovoli namestitev iz neznanih virov. Ni produkcijska izdaja."
          gh release create debug-latest --title "APK (zadnji zeleni CI): release + debug" --notes "$notes" 2>/dev/null \
            || gh release edit debug-latest --title "APK (zadnji zeleni CI): release + debug" --notes "$notes"
          gh release upload debug-latest "$apk" --clobber
          gh release upload debug-latest "$rel" --clobber
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the SDK; setup-android@v3 started failing on the
      # action side (both jobs, ~15s, before any Gradle step), so pin to the local SDK.
      - name: Locate the Android SDK
        run: |
          sdk=""
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then sdk="$candidate"; break; fi
          done
          sm="$(command -v sdkmanager || true)"
          if [ -z "$sm" ] && [ -n "$sdk" ]; then
            sm="$(find "$sdk" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            sm="$(find /usr /opt "$HOME" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$sm" ]; then
            echo "::error::No sdkmanager on this runner. ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT sdk=$sdk"
            exit 1
          fi
          sdk="${sdk:-$(dirname "$(dirname "$(dirname "$sm")")")}"
          echo "::notice::Using ANDROID_HOME=$sdk with sdkmanager=$sm"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$(dirname "$sm")" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          "$sm" --version || { echo "::error::sdkmanager present but not runnable: $sm"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/ci-device-tests.sh
      - name: Publish device diagnostics
        if: always()
        run: python3 tools/report_ci_failures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ci-device.log
            ci-device-crash.log
            ci-device-logcat.log
            app/build/ui-audit/
